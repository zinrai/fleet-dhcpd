name: test
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod

      - name: Install Consul
        run: |
          curl -fsSL -o /tmp/consul.zip https://releases.hashicorp.com/consul/1.22.7/consul_1.22.7_linux_amd64.zip
          unzip -o /tmp/consul.zip -d /tmp
          sudo mv /tmp/consul /usr/local/bin/consul
          consul version

      - name: Start Consul dev agent
        run: |
          consul agent -dev -client=127.0.0.1 > /tmp/consul.log 2>&1 &
          for i in $(seq 1 20); do
            if consul members > /dev/null 2>&1; then
              echo "Consul ready"
              exit 0
            fi
            sleep 1
          done
          echo "Consul did not become ready in time" >&2
          cat /tmp/consul.log >&2
          exit 1

      - run: go vet ./...
      - run: go test -v ./...
      - run: go build .
